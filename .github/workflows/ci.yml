name: ci/cd-pipeline
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
concurrency:
  group: ticketops-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: 238005915203.dkr.ecr.us-east-1.amazonaws.com
jobs:
  preflight:
    name: Validate automation and release settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test release recovery and GitOps image updates
        run: |
          node --test tests/release-version.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check publishing configuration before creating a release
        if: github.event_name == 'push'
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          [[ "$AWS_REGION" == "us-east-1" ]] || { echo "Set AWS_REGION to us-east-1"; exit 1; }
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::238005915203:role/ticketops-dev-github-actions" ]] || { echo "Set the expected TicketOps AWS_ROLE_ARN secret"; exit 1; }
          [[ -n "$GITOPS_TOKEN" ]] || { echo "Set the GitOps write token in GITOPS_TOKEN"; exit 1; }
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install semantic release
        run: npm ci --ignore-scripts
      - name: run semantic-release 
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs

  build-and-push:
    name: push and build the image to ecr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [preflight, release]
    if: |
       always() && needs.preflight.result == 'success' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.release.outputs.new_release_published == 'true')
        )
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: events-api
            context: ./apps/events-api
          - name: bookings-worker
            context: ./apps/bookings-worker
          - name: dashboard
            context: ./apps/dashboard
          - name: admin-api
            context: ./apps/admin-api 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure aws credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: login to aws 
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      - name: set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "IMAGE_TAG=pr-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          else
          echo "IMAGE_TAG=${{ needs.release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          fi
      - name: build docker image 
        run: |
          docker build \
          -t ${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:${{ steps.tag.outputs.IMAGE_TAG }} \
          -t ${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:latest \
           ${{ matrix.service.context }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:${{ steps.tag.outputs.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Push to ECR
        if: github.event_name == 'push'
        run: |
            docker push ${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker push ${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:latest
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - name: Sign Image with Co-Sign
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          DIGEST=$(aws ecr describe-images --repository-name ticketops-dev-${{ matrix.service.name }} --image-ids imageTag=${{ steps.tag.outputs.IMAGE_TAG }} --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Missing ECR image digest"; exit 1; }
          cosign sign --yes \
           "${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}@${DIGEST}"

      - name: Verify published image signature
        if: github.event_name == 'push'
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          DIGEST=$(aws ecr describe-images --repository-name ticketops-dev-${{ matrix.service.name }} --image-ids imageTag=${{ steps.tag.outputs.IMAGE_TAG }} --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Missing ECR image digest"; exit 1; }
          cosign verify \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.ECR_REGISTRY }}/ticketops-dev-${{ matrix.service.name }}@${DIGEST}"

  update-gitops:
    name: Open GitOps image update PR
    runs-on: ubuntu-latest
    needs: [release, build-and-push]
    if: github.event_name == 'push' && needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Checkout application automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout GitOps main branch
        uses: actions/checkout@v4
        with:
          repository: kishoreala/ticketops-gitops-config
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false
      - name: Update application images
        env:
          RELEASE_TAG: ${{ needs.release.outputs.new_release_version }}
        run: python3 scripts/update-gitops-images.py --root gitops --tag "$RELEASE_TAG"
      - name: Create or update image PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: main
          branch: update-images-${{ needs.release.outputs.new_release_version }}
          add-paths: manifests/**
          commit-message: 'chore: update all services to ${{ needs.release.outputs.new_release_version }}'
          title: 'chore: update all services to ${{ needs.release.outputs.new_release_version }}'
          body: 'Automated image update after all four images were built, pushed, signed, and verified. Version: ${{ needs.release.outputs.new_release_version }}'
